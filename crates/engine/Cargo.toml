[package]
name = "remapr-engine"
description = "Remapr's keyboard backends: hooks each system's keys, asks remapr-core what to do, injects the result"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
remapr-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
remapr-platform = { workspace = true }
windows-sys = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { workspace = true, features = ["CFDate", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { workspace = true, features = ["NSString"] }
