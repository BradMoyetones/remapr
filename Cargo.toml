[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]
default-members = ["apps/remapr"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Brad Moyetones"]
repository = "https://github.com/BradMoyetones/remapr"

[workspace.dependencies]
remapr-engine = { path = "crates/engine" }
remapr-platform = { path = "crates/platform" }
remapr-ui = { path = "crates/ui" }
remapr-update = { path = "crates/update" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "1"
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30", default-features = false }
winresource = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
# `deny`, not `forbid`: the engine's hook module is the one place allowed to opt out.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
